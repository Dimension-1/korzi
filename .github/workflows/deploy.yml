name: Deploy to Hostinger VPS

on:
  push:
    branches: [ release/prod ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      env:
        VITE_HYPGRAPH_URL: ${{ secrets.VITE_HYPGRAPH_URL }}
        VITE_SHOPIFY_STOREFRONT_URL: ${{ secrets.VITE_SHOPIFY_STOREFRONT_URL }}
        VITE_SHOPIFY_ADMIN_TOKEN: ${{ secrets.VITE_SHOPIFY_ADMIN_TOKEN }}
      run: npm run build

    - name: Deploy to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "dist/*"
        target: ${{ secrets.VPS_PATH }}
        strip_components: 1
        rm: true

    - name: Restart Nginx
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          chown -R www-data:www-data ${{ secrets.VPS_PATH }}
          chmod -R 755 ${{ secrets.VPS_PATH }}
          systemctl restart nginx
